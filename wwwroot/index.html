<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        http-equiv="X-UA-Compatible"
        content="ie=edge"
    >

    <link
        rel="icon"
        type="image/x-icon"
        href="https://cdn.autodesk.io/favicon.ico"
    >

    <!-- APS Viewer CSS -->
    <link
        rel="stylesheet"
        href="https://developer.api.autodesk.com/modelderivative/v2/viewers/7.*/style.css"
    >

    <!-- Our CSS -->
    <link
        rel="stylesheet"
        href="/main.css"
    >

    <title>
        BIM 360° Environment Viewer
    </title>

</head>


<body>


    <!-- ==================================================
         HEADER
    ================================================== -->

    <div id="header">


        <img
            class="logo"
            src="https://cdn.autodesk.io/logo/black/stacked.png"
            alt="Autodesk Platform Services"
        >


        <span class="title">
            BIM + 360° Environment
        </span>


        <!-- MODEL -->

        <label
            class="control-label"
            for="models"
        >
            Model:
        </label>


        <select
            id="models"
            name="models"
        >
        </select>


        <button
            id="upload"
            type="button"
        >
            Upload Model
        </button>


        <input
            type="file"
            id="input"
            style="display:none"
            accept=".rvt,.zip"
        >


        <!-- ENVIRONMENT -->

        <button
            id="environment-toggle"
            type="button"
        >
            Environment: ON
        </button>


        <!-- VIDEO -->

        <label
            class="control-label"
            for="video-select"
        >
            360 Video:
        </label>


        <select
            id="video-select"
        >
        </select>


        <button
            id="video-upload"
            type="button"
        >
            Upload Video
        </button>


        <input
            type="file"
            id="video-input"
            style="display:none"
            accept="video/mp4,video/webm,video/*"
        >


        <button
            id="video-url"
            type="button"
        >
            Video URL
        </button>


        <!-- VIDEO CONTROLS -->

        <button
            id="video-play"
            type="button"
        >
            ▶ Play
        </button>


        <button
            id="video-pause"
            type="button"
        >
            ⏸ Pause
        </button>


        <button
            id="video-mute"
            type="button"
        >
            🔇 Muted
        </button>


    </div>


    <!-- ==================================================
         VIEWER
    ================================================== -->

    <div id="preview"></div>


    <!-- ==================================================
         OVERLAY
    ================================================== -->

    <div id="overlay"></div>


    <!-- ==================================================
         IMPORTANT
         DO NOT LOAD THREE.JS HERE.
         
         APS Viewer already contains Three.js.
    ================================================== -->


    <!-- APS Viewer -->
    <script
        src="https://developer.api.autodesk.com/modelderivative/v2/viewers/7.*/viewer3D.js"
    ></script>


    <!-- Application -->
    <script
        src="/main.js"
        type="module"
    ></script>


</body>

</html>
